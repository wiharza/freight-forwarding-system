name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # HARDENING 2026-11-04: semua langkah di bawah ini CHECK-ONLY — CI tidak
      # boleh mengubah file. Sebelumnya `pint` (tanpa --test), `npm run format`
      # (prettier --write) dan `npm run lint` (eslint --fix) semuanya MENULIS,
      # sehingga CI hijau padahal kode yang di-push melanggar gaya — dan
      # langkah auto-commit-nya pun sudah dikomentari, jadi perubahannya
      # hilang begitu saja. Pelanggaran gaya sekarang menggagalkan CI.
      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Format Frontend
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check

      - name: Typecheck Frontend
        run: npm run typecheck

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
