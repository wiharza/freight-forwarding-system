services:
  app:
    build: ./webapp
    volumes:
      - ./webapp:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./webapp:/var/www/html:ro
      - ./webapp/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ppjk
      POSTGRES_USER: ppjk
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppjk -d ppjk"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
